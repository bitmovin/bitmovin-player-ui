name: 'Setup Dependencies'
description: 'Sets up Node.js, caches node modules, and installs dependencies'

runs:
  using: 'composite'
  steps:
    - name: Set up node.js
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash
